version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: cv_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - cv-network
    environment:
      - NODE_ENV=development
    env_file:
      - .env

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: cv_backend
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - cv-network
    environment:
      - NODE_ENV=development
      - PORT=3001
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    env_file:
      - .env
      
  nginx:
    image: nginx:alpine
    container_name: cv_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - cv-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: cv_jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - cv-network

networks:
  cv-network:
    driver: bridge